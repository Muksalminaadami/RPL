<!doctype html>
<html lang="id" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Katalog UMKM — Belanja Lokal Lebih Dekat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet" />
    <style>
      :root { --ease: cubic-bezier(0.16,1,0.3,1); --spring: cubic-bezier(0.34,1.56,0.64,1); --nav-h: 60px; --cat-h: 56px; --bn-h: 64px; }
      [data-theme="dark"] { --bg:#07080f; --bg2:#0c0f1c; --bg3:#111525; --card:#0d1120; --card2:#141928; --bdr:rgba(120,140,220,.12); --bdr2:rgba(120,140,220,.28); --bdr3:rgba(120,140,220,.5); --tx:#e2e8ff; --txm:#7585ab; --txs:#4a5578; --ac:#7c8eff; --ac2:#38e8c6; --ac3:#f97fa8; --nav-bg:rgba(7,8,15,.82); --sh:0 24px 48px rgba(0,0,0,.55),0 8px 16px rgba(0,0,0,.3); --sh-sm:0 4px 12px rgba(0,0,0,.3); --glow:0 0 24px rgba(124,142,255,.25); --skel1:#0d1120; --skel2:#161d30; --ok:#2fe8a8; --danger:#ff6b8a; --warn:#fbbf24; }
      [data-theme="light"] { --bg:#f0f2ff; --bg2:#e5e9ff; --bg3:#dce2ff; --card:#ffffff; --card2:#f5f7ff; --bdr:rgba(80,90,200,.1); --bdr2:rgba(80,90,200,.22); --bdr3:rgba(80,90,200,.4); --tx:#0f1630; --txm:#485080; --txs:#8892bb; --ac:#4f5ee8; --ac2:#0ea87a; --ac3:#e8326b; --nav-bg:rgba(240,242,255,.85); --sh:0 16px 40px rgba(40,50,140,.12),0 4px 12px rgba(40,50,140,.08); --sh-sm:0 2px 8px rgba(40,50,140,.1); --glow:0 0 24px rgba(79,94,232,.2); --skel1:#dce2ff; --skel2:#eaeeff; --ok:#059669; --danger:#e23060; --warn:#d97706; }
      *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
      html { scroll-behavior:smooth; }
      body { font-family:"DM Sans",sans-serif; background:var(--bg); color:var(--tx); min-height:100vh; overflow-x:hidden; padding-bottom:var(--bn-h); transition:background .4s var(--ease),color .4s var(--ease); }
      @media(min-width:880px){ body{ padding-bottom:0; } }
      ::selection { background:var(--ac); color:#fff; }
      @media(prefers-reduced-motion:reduce){ *,*::before,*::after{ animation-duration:.01ms!important; transition-duration:.01ms!important; } }

      /* LOADER */
      #loader { position:fixed; inset:0; z-index:9999; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; transition:opacity .5s var(--ease),visibility .5s; }
      #loader.hidden { opacity:0; visibility:hidden; pointer-events:none; }
      .loader-logo { font-family:"Syne",sans-serif; font-size:2rem; font-weight:800; background:linear-gradient(135deg,var(--ac),var(--ac2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; animation:lPulse 1.5s ease-in-out infinite; }
      @keyframes lPulse { 0%,100%{opacity:.5} 50%{opacity:1} }
      .loader-bar-wrap { width:120px; height:3px; background:var(--bdr); border-radius:2px; overflow:hidden; }
      .loader-bar { height:100%; background:linear-gradient(90deg,var(--ac),var(--ac2)); border-radius:2px; animation:lBar 1.2s var(--ease) forwards; }
      @keyframes lBar { from{width:0} to{width:100%} }

      /* AMBIENT */
      .ambient { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
      .ab { position:absolute; border-radius:50%; filter:blur(100px); opacity:.16; will-change:transform; }
      .ab:nth-child(1){ width:500px; height:500px; background:var(--ac); top:-150px; left:-100px; animation:ab1 22s ease-in-out infinite; }
      .ab:nth-child(2){ width:420px; height:420px; background:var(--ac2); bottom:10%; right:-80px; animation:ab2 28s ease-in-out infinite; }
      .ab:nth-child(3){ width:320px; height:320px; background:var(--ac3); top:40%; left:25%; animation:ab3 18s ease-in-out infinite; }
      @keyframes ab1 { 0%,100%{transform:translate(0,0)} 33%{transform:translate(60px,80px)} 66%{transform:translate(-30px,40px)} }
      @keyframes ab2 { 0%,100%{transform:translate(0,0)} 33%{transform:translate(-70px,-40px)} 66%{transform:translate(40px,-60px)} }
      @keyframes ab3 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(40px,-60px)} }

      /* HEADER */
      header { position:fixed; top:0; left:0; width:100%; z-index:500; height:var(--nav-h); display:flex; align-items:center; background:var(--nav-bg); backdrop-filter:blur(28px) saturate(180%); -webkit-backdrop-filter:blur(28px) saturate(180%); border-bottom:1px solid var(--bdr); transition:background .3s,border-color .3s,box-shadow .3s; animation:hDrop .55s var(--spring) both; }
      header.scrolled { box-shadow:0 4px 20px rgba(0,0,0,.15); }
      @keyframes hDrop { from{transform:translateY(-100%)} to{transform:translateY(0)} }
      .header-inner { width:100%; max-width:1400px; margin:0 auto; padding:0 clamp(12px,3vw,28px); display:flex; align-items:center; gap:clamp(8px,1.8vw,18px); }
      .nav-logo { font-family:"Syne",sans-serif; font-weight:800; color:var(--tx); text-decoration:none; font-size:clamp(.9rem,1.3vw,1.05rem); display:flex; align-items:center; gap:7px; flex-shrink:0; white-space:nowrap; transition:transform .3s var(--spring); }
      .nav-logo:hover { transform:scale(1.04); }
      .nav-logo:active { transform:scale(.94); }
      .logo-mark { width:30px; height:30px; border-radius:8px; background:linear-gradient(135deg,var(--ac),var(--ac2)); display:flex; align-items:center; justify-content:center; font-size:.85rem; flex-shrink:0; box-shadow:0 4px 12px rgba(124,142,255,.3); transition:transform .3s var(--spring),box-shadow .3s; }
      .nav-logo:hover .logo-mark { transform:rotate(-8deg) scale(1.1); box-shadow:0 6px 18px rgba(124,142,255,.4); }
      .logo-text { display:flex; flex-direction:column; line-height:1.1; }
      .logo-text b { background:linear-gradient(120deg,var(--ac),var(--ac2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
      .logo-text small { font-size:.6rem; font-weight:400; color:var(--txm); font-family:"DM Sans",sans-serif; letter-spacing:.04em; }
      @media(max-width:420px){ .logo-text{ display:none; } }
      .search-shell { flex:1 1 auto; position:relative; min-width:0; max-width:600px; margin:0 auto; }
      .search-shell input { width:100%; padding:9px 38px 9px 36px; background:var(--bg3); color:var(--tx); border:1.5px solid var(--bdr); border-radius:10px; outline:none; font-size:.85rem; font-family:inherit; transition:border-color .25s,box-shadow .25s,background .25s,transform .2s var(--spring); }
      .search-shell input:focus { border-color:var(--ac); box-shadow:0 0 0 4px rgba(124,142,255,.15),var(--glow); transform:scale(1.01); }
      .search-shell input::placeholder { color:var(--txm); }
      .ico-s { position:absolute; left:11px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--txm); pointer-events:none; transition:color .25s,transform .3s var(--spring); }
      .search-shell:focus-within .ico-s { color:var(--ac); transform:translateY(-50%) scale(1.1); }
      .s-clear { position:absolute; right:7px; top:50%; transform:translateY(-50%) scale(0); width:20px; height:20px; border:none; background:var(--bg2); color:var(--txm); border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .25s var(--spring); }
      .s-clear svg { width:10px; height:10px; }
      .s-clear.show { transform:translateY(-50%) scale(1); }
      .s-clear:hover { background:var(--danger); color:#fff; transform:translateY(-50%) scale(1.2); }
      .nav-side { display:flex; align-items:center; gap:7px; flex-shrink:0; }
      .icon-btn { width:36px; height:36px; border-radius:9px; border:1px solid var(--bdr); background:var(--bg3); color:var(--tx); display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative; transition:transform .25s var(--spring),border-color .25s,box-shadow .25s,background .25s; flex-shrink:0; }
      .icon-btn:hover { border-color:var(--bdr2); transform:translateY(-2px); box-shadow:var(--sh-sm); }
      .icon-btn:active { transform:scale(.88); }
      .icon-btn svg { width:17px; height:17px; transition:transform .3s var(--spring); }
      .icon-btn:hover svg { transform:scale(1.12); }
      .cart-badge { position:absolute; top:-5px; right:-5px; min-width:16px; height:16px; padding:0 3px; border-radius:8px; background:var(--danger); color:#fff; font-size:.6rem; font-weight:700; display:flex; align-items:center; justify-content:center; transform:scale(0); transition:transform .3s var(--spring); }
      .cart-badge.show { transform:scale(1); animation:bPop .4s var(--spring); }
      @keyframes bPop { 0%{transform:scale(0)} 60%{transform:scale(1.4)} 100%{transform:scale(1)} }
      @media(max-width:879px){ #cartBtnTop,#btnLoginHeader,.admin-pill{ display:none!important; } .btn-logout{ display:none; } .btn-logout.mobile-show{ display:flex!important; } }
      .admin-pill { display:flex; align-items:center; gap:7px; padding:5px 10px 5px 5px; background:linear-gradient(135deg,rgba(124,142,255,.15),rgba(56,232,198,.1)); border:1px solid var(--bdr2); border-radius:999px; font-size:.78rem; cursor:pointer; white-space:nowrap; flex-shrink:0; transition:border-color .25s,transform .25s var(--spring),box-shadow .25s; }
      .admin-pill:hover { border-color:var(--bdr3); transform:translateY(-2px); box-shadow:var(--sh-sm); }
      .admin-pill:active { transform:scale(.95); }
      .admin-avatar { width:24px; height:24px; border-radius:50%; background:linear-gradient(135deg,var(--ac),var(--ac2)); display:flex; align-items:center; justify-content:center; font-size:.68rem; font-weight:700; color:#fff; flex-shrink:0; transition:transform .3s var(--spring); }
      .admin-pill:hover .admin-avatar { transform:rotate(10deg) scale(1.1); }
      .btn-login-header { display:flex; align-items:center; gap:6px; padding:7px 14px; background:linear-gradient(135deg,var(--ac),var(--ac2)); color:#fff; border:none; border-radius:9px; font-family:"DM Sans",sans-serif; font-size:.78rem; font-weight:700; cursor:pointer; transition:transform .25s var(--spring),box-shadow .25s; }
      .btn-login-header:hover { transform:translateY(-2px); box-shadow:0 6px 18px rgba(124,142,255,.4); }
      .btn-login-header:active { transform:scale(.95); }
      .btn-login-header svg { width:15px; height:15px; }
      .btn-logout { display:flex; align-items:center; gap:5px; padding:6px 11px; background:rgba(255,107,138,.12); border:1px solid rgba(255,107,138,.3); color:var(--danger); border-radius:8px; font-family:"DM Sans",sans-serif; font-size:.75rem; font-weight:600; cursor:pointer; transition:all .25s var(--spring); white-space:nowrap; }
      .btn-logout:hover { background:var(--danger); color:#fff; border-color:var(--danger); transform:translateY(-1px); box-shadow:0 4px 14px rgba(255,107,138,.35); }
      .btn-logout:active { transform:scale(.94); }
      .btn-logout svg { width:13px; height:13px; }

      /* CAT STRIP */
      .cat-wrap { position:fixed; top:var(--nav-h); left:0; width:100%; z-index:490; background:var(--bg); border-bottom:1px solid var(--bdr); transition:transform .3s var(--ease),box-shadow .3s; animation:fSD .45s var(--ease) .2s both; }
      .cat-wrap.hide { transform:translateY(-100%); }
      @keyframes fSD { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
      .cat-inner { position:relative; max-width:1400px; margin:0 auto; }
      .cat-inner::after { content:""; position:absolute; top:0; right:0; bottom:0; width:40px; background:linear-gradient(to right,transparent,var(--bg)); pointer-events:none; transition:opacity .3s; }
      .cat-inner.at-end::after { opacity:0; }
      .cat-strip { display:flex; gap:7px; overflow-x:auto; padding:9px clamp(12px,3vw,28px); scrollbar-width:none; }
      .cat-strip::-webkit-scrollbar { display:none; }
      .chip { flex-shrink:0; padding:6px 14px; border-radius:999px; border:1.5px solid var(--bdr); background:transparent; color:var(--txm); font-family:"DM Sans",sans-serif; font-size:.78rem; font-weight:600; cursor:pointer; white-space:nowrap; position:relative; overflow:hidden; transition:all .3s var(--spring); }
      .chip span { position:relative; z-index:1; }
      .chip:not(.active):hover { border-color:var(--bdr2); color:var(--tx); transform:translateY(-1px); }
      .chip.active { background:linear-gradient(135deg,var(--ac),var(--ac2)); border-color:transparent; color:#fff; box-shadow:0 4px 14px rgba(124,142,255,.35); animation:chipIn .35s var(--spring); }
      @keyframes chipIn { 0%{transform:scale(.9)} 60%{transform:scale(1.06)} 100%{transform:scale(1)} }
      .chip:active { transform:scale(.92); }

      /* HERO */
      .hero { max-width:760px; margin:0 auto; padding:calc(var(--nav-h) + var(--cat-h) + 32px) clamp(16px,4vw,32px) 0; text-align:center; animation:hUp .7s var(--ease) .05s both; }
      @keyframes hUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
      .hero-badge { display:inline-flex; align-items:center; gap:7px; padding:5px 13px; border-radius:999px; background:var(--bg3); border:1px solid var(--bdr2); font-size:.72rem; font-weight:600; color:var(--ac); margin-bottom:12px; animation:hUp .5s var(--ease) .1s both; }
      .dot-live { width:7px; height:7px; border-radius:50%; background:var(--ok); animation:livePulse 2s ease-in-out infinite; }
      @keyframes livePulse { 0%,100%{box-shadow:0 0 0 0 rgba(47,232,168,.5)} 50%{box-shadow:0 0 0 5px rgba(47,232,168,0)} }
      .hero h1 { font-family:"Syne",sans-serif; font-size:clamp(1.5rem,3.5vw,2.2rem); font-weight:800; line-height:1.2; letter-spacing:-.02em; }
      .hero h1 em { font-style:normal; background:linear-gradient(120deg,var(--ac),var(--ac2),var(--ac3)); background-size:200% auto; -webkit-background-clip:text; -webkit-text-fill-color:transparent; animation:gShift 5s ease-in-out infinite; }
      @keyframes gShift { 0%,100%{background-position:0%} 50%{background-position:100%} }
      .hero p { margin-top:8px; color:var(--txm); font-size:.85rem; line-height:1.6; }
      .auth-strip { display:flex; justify-content:center; gap:10px; padding:12px 16px 0; flex-wrap:wrap; animation:hUp .6s var(--ease) .25s both; }

      /* BUTTONS */
      .btn { padding:8px 18px; border-radius:9px; border:none; cursor:pointer; font-family:"DM Sans",sans-serif; font-weight:600; font-size:.82rem; position:relative; overflow:hidden; transition:transform .2s var(--spring),box-shadow .25s; }
      .btn:active { transform:scale(.95); }
      .btn-primary { background:linear-gradient(135deg,var(--ac),var(--ac2)); color:#fff; box-shadow:0 4px 14px rgba(124,142,255,.3); }
      .btn-primary:hover { box-shadow:0 8px 22px rgba(124,142,255,.45); transform:translateY(-2px); }
      .btn-outline { background:transparent; color:var(--tx); border:1.5px solid var(--bdr2); }
      .btn-outline:hover { border-color:var(--bdr3); transform:translateY(-1px); }
      .btn-ghost { background:var(--bg3); color:var(--tx); border:1px solid var(--bdr); }
      .btn-ghost:hover { border-color:var(--bdr2); transform:translateY(-1px); }
      .btn-success { background:linear-gradient(135deg,#22c55e,#15803d); color:#fff; box-shadow:0 4px 14px rgba(34,197,94,.25); }
      .btn-success:hover { box-shadow:0 8px 22px rgba(34,197,94,.4); transform:translateY(-2px); }
      .ripple { position:absolute; border-radius:50%; background:rgba(255,255,255,.4); transform:scale(0); animation:rip .6s var(--ease) forwards; pointer-events:none; }
      @keyframes rip { to{transform:scale(4);opacity:0} }

      /* GRID */
      .grid-wrap { max-width:1400px; margin:0 auto; padding:16px clamp(12px,3vw,28px) 48px; position:relative; z-index:1; }
      .sec-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; padding:0 2px; animation:hUp .55s var(--ease) .3s both; }
      .sec-header h2 { font-family:"Syne",sans-serif; font-size:1rem; font-weight:700; }
      .res-count { font-size:.73rem; color:var(--txm); background:var(--bg3); border:1px solid var(--bdr); padding:3px 9px; border-radius:999px; }
      .res-count.pop { animation:cPop .35s var(--spring); }
      @keyframes cPop { 0%{transform:scale(.8);opacity:0} 60%{transform:scale(1.1)} 100%{transform:scale(1);opacity:1} }
      #prodGrid { display:grid; grid-template-columns:repeat(2,1fr); gap:11px; align-items:start; }
      @media(min-width:540px){ #prodGrid{ grid-template-columns:repeat(3,1fr); gap:13px; } }
      @media(min-width:800px){ #prodGrid{ grid-template-columns:repeat(4,1fr); } }
      @media(min-width:1100px){ #prodGrid{ grid-template-columns:repeat(5,1fr); gap:15px; } }

      /* CARD */
      .card { background:var(--card); border:1px solid var(--bdr); border-radius:16px; overflow:hidden; display:flex; flex-direction:column; position:relative; cursor:default; opacity:0; transform:translateY(18px) scale(.96); transition:transform .4s var(--spring),box-shadow .35s var(--ease),border-color .3s,opacity .4s; will-change:transform,box-shadow; }
      .card.in { opacity:1; transform:translateY(0) scale(1); }
      .card:hover { transform:translateY(-8px) scale(1.015); box-shadow:var(--sh),0 0 0 1px var(--bdr2); border-color:var(--bdr2); }
      .card-img { height:118px; display:flex; align-items:center; justify-content:center; font-size:2.6rem; background:var(--bg3); position:relative; overflow:hidden; transition:transform .45s var(--ease); }
      @media(min-width:540px){ .card-img{ height:145px; font-size:3.1rem; } }
      .card:hover .card-img { transform:scale(1.08); }
      .card-img::after { content:""; position:absolute; inset:0; background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.16) 50%,transparent 65%); transform:translateX(-130%); pointer-events:none; }
      .card:hover .card-img::after { animation:shine .7s var(--ease); }
      @keyframes shine { to{transform:translateX(130%)} }
      .card-badges { position:absolute; top:8px; left:8px; display:flex; gap:4px; z-index:5; }
      .badge { font-size:.6rem; font-weight:700; padding:3px 7px; border-radius:6px; box-shadow:0 2px 8px rgba(0,0,0,.2); }
      .b-empty { background:var(--danger); color:#fff; }
      .b-low { background:var(--warn); color:#3a2600; animation:bPulse 1.8s ease-in-out infinite; }
      @keyframes bPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.07)} }
      .btn-del { position:absolute; top:8px; right:8px; z-index:10; width:26px; height:26px; border-radius:50%; background:var(--danger); color:#fff; border:none; align-items:center; justify-content:center; cursor:pointer; transition:transform .25s var(--spring); }
      .btn-del svg { width:12px; height:12px; }
      .btn-del:hover { transform:scale(1.18) rotate(90deg); }
      .card-body { padding:10px 12px 12px; flex:1; display:flex; flex-direction:column; gap:3px; }
      .card-kat { font-size:.6rem; color:var(--ac); font-weight:700; text-transform:uppercase; letter-spacing:.06em; display:flex; align-items:center; gap:4px; }
      .card-kat::before { content:""; width:4px; height:4px; border-radius:50%; background:var(--ac); flex-shrink:0; }
      .card-name { font-family:"Syne",sans-serif; font-size:.84rem; font-weight:700; line-height:1.3; color:var(--tx); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:2.18em; }
      .card-price { font-size:.92rem; font-weight:700; color:var(--ac); margin-top:1px; transition:transform .25s var(--spring); display:inline-block; }
      .card:hover .card-price { transform:scale(1.05); }
      .card-meta { display:flex; align-items:center; gap:5px; font-size:.66rem; color:var(--txm); margin-top:1px; }
      .card-meta svg { width:11px; height:11px; flex-shrink:0; }
      .card-desc { font-size:.71rem; color:var(--txm); line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
      .btn-dis { margin-top:8px; padding:9px; text-align:center; background:var(--bg3); color:var(--txs); border-radius:10px; font-size:.78rem; font-weight:600; border:1px solid var(--bdr); cursor:not-allowed; }
      .card-actions { display:flex; gap:6px; margin-top:8px; }
      .btn-order { flex:1; padding:9px 6px; text-align:center; background:linear-gradient(135deg,#22c55e,#15803d); color:#fff; border-radius:10px; font-size:.76rem; font-weight:700; display:flex; align-items:center; justify-content:center; gap:5px; border:none; cursor:pointer; position:relative; overflow:hidden; transition:transform .25s var(--spring),box-shadow .25s; min-width:0; }
      .btn-order:hover { box-shadow:0 8px 20px rgba(34,197,94,.45); transform:translateY(-2px); }
      .btn-order:active { transform:scale(.96); }
      .btn-order svg { width:13px; height:13px; flex-shrink:0; transition:transform .35s var(--spring); }
      .btn-order:hover svg { transform:rotate(-10deg) scale(1.18); }
      .btn-addcart { flex-shrink:0; width:38px; padding:9px 0; text-align:center; background:var(--bg3); color:var(--tx); border-radius:10px; font-size:1rem; border:1.5px solid var(--bdr2); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform .25s var(--spring),border-color .25s,background .25s,box-shadow .25s; position:relative; overflow:hidden; }
      .btn-addcart:hover { border-color:var(--ac); background:var(--bg2); transform:translateY(-2px); box-shadow:0 4px 14px rgba(124,142,255,.25); }
      .btn-addcart:active { transform:scale(.9); }
      .btn-addcart.added { animation:cartPop .4s var(--spring); }
      @keyframes cartPop { 0%{transform:scale(1)} 40%{transform:scale(1.25)} 100%{transform:scale(1)} }
      .fly { position:fixed; z-index:900; font-size:1.4rem; pointer-events:none; transition:left .65s cubic-bezier(.2,.85,.3,.98),top .65s cubic-bezier(.2,.85,.3,.98),transform .65s,opacity .65s; }

      /* SKELETON */
      .skel { background:var(--card); border:1px solid var(--bdr); border-radius:16px; overflow:hidden; }
      .skel-img { height:118px; background:var(--skel1); position:relative; overflow:hidden; }
      @media(min-width:540px){ .skel-img{ height:145px; } }
      .skel-img::after,.skel-ln::after { content:""; position:absolute; inset:0; background:linear-gradient(90deg,transparent 25%,var(--skel2) 50%,transparent 75%); background-size:200% 100%; animation:shim 1.5s ease-in-out infinite; }
      .skel-ln { position:relative; height:10px; margin:10px 12px; border-radius:5px; background:var(--skel1); overflow:hidden; }
      .skel-ln.w50 { width:50%; }
      .skel-ln.w35 { width:35%; height:14px; }
      @keyframes shim { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
      .empty-s { grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--txm); animation:hUp .5s var(--ease); }
      .empty-s svg { width:50px; height:50px; color:var(--txs); margin-bottom:12px; }
      .empty-s.err svg { color:var(--danger); }
      .empty-s b { display:block; font-family:"Syne",sans-serif; margin-bottom:4px; }
      .empty-s small { font-size:.78rem; }

      /* MODAL */
      .overlay { display:flex; position:fixed; inset:0; z-index:800; background:transparent; backdrop-filter:blur(0px); align-items:flex-end; justify-content:center; pointer-events:none; transition:background .35s var(--ease),backdrop-filter .35s var(--ease); }
      .overlay.open { background:rgba(0,0,0,.65); backdrop-filter:blur(8px); pointer-events:auto; }
      @media(min-width:640px){ .overlay{ align-items:center; } }
      .modal { width:100%; max-width:450px; background:var(--card); padding:24px; padding-bottom:calc(24px + var(--bn-h)); border-radius:22px 22px 0 0; border:1px solid var(--bdr2); max-height:90vh; overflow-y:auto; transform:translateY(110%); transition:transform .42s var(--spring); }
      .overlay.open .modal { transform:translateY(0); }
      @media(min-width:640px){ .modal{ border-radius:20px; padding-bottom:24px; transform:scale(.93) translateY(20px); opacity:0; transition:transform .4s var(--spring),opacity .3s var(--ease); } .overlay.open .modal{ transform:scale(1) translateY(0); opacity:1; } }
      .modal-title { font-family:"Syne",sans-serif; font-size:1.1rem; font-weight:700; margin-bottom:18px; display:flex; align-items:center; gap:8px; }
      .fg { margin-bottom:13px; }
      .fg label { display:block; font-size:.75rem; font-weight:600; color:var(--txm); margin-bottom:5px; }
      .fg input,.fg select,.fg textarea { width:100%; padding:10px 12px; background:var(--bg3); color:var(--tx); border:1.5px solid var(--bdr); border-radius:9px; outline:none; font-size:.85rem; font-family:inherit; transition:border-color .2s,box-shadow .2s; }
      .fg input:focus,.fg select:focus,.fg textarea:focus { border-color:var(--ac); box-shadow:0 0 0 3px rgba(124,142,255,.15); }
      .fg textarea { resize:vertical; min-height:68px; }

      /* TOAST */
      .toast-wrap { position:fixed; top:calc(var(--nav-h) + 10px); left:50%; transform:translateX(-50%); z-index:950; display:flex; flex-direction:column; gap:7px; align-items:center; pointer-events:none; }
      .toast { background:var(--card2); color:var(--tx); border:1px solid var(--bdr2); padding:9px 15px; border-radius:10px; font-size:.81rem; font-weight:600; box-shadow:var(--sh); display:flex; align-items:center; gap:8px; white-space:nowrap; animation:tIn .4s var(--spring) both; }
      .toast.out { animation:tOut .3s var(--ease) forwards; }
      .toast svg { width:15px; height:15px; flex-shrink:0; }
      .toast.ok svg { color:var(--ok); }
      .toast.err svg { color:var(--danger); }
      .toast.info svg { color:var(--ac); }
      @keyframes tIn { from{opacity:0;transform:translateY(-14px) scale(.9)} to{opacity:1;transform:translateY(0) scale(1)} }
      @keyframes tOut { to{opacity:0;transform:translateY(-10px) scale(.9)} }

      /* BOTTOM NAV */
      .bn { position:fixed; bottom:0; left:0; width:100%; z-index:500; background:var(--nav-bg); backdrop-filter:blur(28px) saturate(180%); -webkit-backdrop-filter:blur(28px) saturate(180%); border-top:1px solid var(--bdr); padding-bottom:env(safe-area-inset-bottom,0); }
      @media(min-width:880px){ .bn{ display:none; } }
      .bn-row { display:grid; grid-template-columns:repeat(3,1fr); height:var(--bn-h); position:relative; }
      .bn-pill { position:absolute; top:7px; bottom:7px; border-radius:12px; background:linear-gradient(135deg,rgba(124,142,255,.14),rgba(56,232,198,.1)); pointer-events:none; width:33.333%; left:0; transition:transform .4s var(--spring),width .4s var(--spring); }
      .bn-item { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--txm); cursor:pointer; background:none; border:none; font-family:"DM Sans",sans-serif; position:relative; z-index:1; width:100%; height:100%; padding:0; line-height:1; transition:color .25s; }
      .bn-item svg { width:20px; height:20px; transition:transform .35s var(--spring); }
      .bn-item span { font-size:.61rem; font-weight:600; transition:transform .3s var(--spring); display:block; }
      .bn-item.active { color:var(--ac); }
      .bn-item.active svg { transform:translateY(-3px) scale(1.1); }
      .bn-item.active span { transform:translateY(-1px); }
      .bn-item:active svg { transform:scale(.8); }
      .bn-iw { position:relative; display:inline-flex; align-items:center; justify-content:center; }
      .bn-badge { position:absolute; top:-5px; right:-10px; min-width:16px; height:16px; padding:0 4px; border-radius:8px; background:var(--danger); color:#fff; font-size:.58rem; font-weight:700; display:flex; align-items:center; justify-content:center; transform:scale(0); transition:transform .3s var(--spring); z-index:2; pointer-events:none; line-height:1; }
      .bn-badge.show { transform:scale(1); animation:bPop .4s var(--spring); }

      /* CART */
      .cart-list { display:flex; flex-direction:column; gap:9px; margin:8px 0 14px; }
      .cart-row { display:flex; gap:10px; align-items:center; background:var(--bg3); border:1px solid var(--bdr); border-radius:11px; padding:9px; animation:hUp .3s var(--ease) both; }
      .cart-emoji { font-size:1.7rem; width:44px; text-align:center; flex-shrink:0; }
      .cart-info { flex:1; min-width:0; }
      .cart-info b { font-size:.83rem; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .cart-info small { font-size:.72rem; color:var(--txm); }
      .cart-rm { background:none; border:none; color:var(--txm); cursor:pointer; padding:5px; display:flex; align-items:center; justify-content:center; border-radius:6px; flex-shrink:0; transition:color .2s,transform .25s var(--spring),background .2s; }
      .cart-rm svg { width:14px; height:14px; }
      .cart-rm:hover { color:var(--danger); background:rgba(255,107,138,.1); transform:scale(1.15) rotate(90deg); }
      .cart-total { display:flex; justify-content:space-between; align-items:center; padding:11px 2px; border-top:1px dashed var(--bdr2); font-weight:700; }
      .cart-empty { text-align:center; padding:32px 10px; color:var(--txm); }
      .cart-empty svg { width:44px; height:44px; color:var(--txs); margin-bottom:8px; display:block; margin-left:auto; margin-right:auto; }
      .cart-wa-info { display:flex; align-items:center; gap:8px; font-size:.74rem; color:var(--txm); background:var(--bg3); border:1px solid var(--bdr); border-radius:9px; padding:8px 10px; margin-bottom:10px; }
      .cart-wa-info svg { width:14px; height:14px; color:var(--ok); flex-shrink:0; }
      .cart-wa-info b { color:var(--tx); }

      ::-webkit-scrollbar { width:6px; height:6px; }
      ::-webkit-scrollbar-thumb { background:var(--bdr2); border-radius:3px; }
      button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible { outline:2px solid var(--ac); outline-offset:2px; }
      @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)} }
    </style>
  </head>
  <body>
    <div id="loader">

    <div class="cat-wrap" id="catWrap">

    <script>
      const API = "https://script.google.com/macros/s/AKfycbyDQgaduxIQ60PDEXw-lGzcPdGbJWPoKxuSnXIJaqommkNW4n0MXR6LZ7_7IXaZSuew_A/exec";
      const STORE_KONTAK_ID = "C01";
      let storeContact = { wa: "", nama: "Toko" };

      async function loadStoreContact() {
        try {
          const res = await fetch(`${API}?action=kontak&id=${encodeURIComponent(STORE_KONTAK_ID)}`);
          const data = await res.json();
          if (data.status === true && data.wa) {
            storeContact = { wa: data.wa, nama: data.nama || "Toko" };
          } else {
            console.warn("Kontak toko tidak ditemukan:", data.message);
          }
        } catch (e) {
          console.error("Gagal memuat kontak toko:", e);
        }
      }
      function getStoreWA()   { return storeContact.wa   || ""; }
      function getStoreName() { return storeContact.nama || "Toko"; }

      let products = [], cart = [], userLogin = null, activeKat = "", searchKw = "", lastScroll = 0;

      /* LOADER */
      window.addEventListener("load", () =>
        setTimeout(() => document.getElementById("loader").classList.add("hidden"), 800)
      );

      /* LAYOUT */
      function measureLayout() {
        const header  = document.getElementById("mainHeader");
        const catWrap = document.getElementById("catWrap");
        if (!header || !catWrap) return;
        const nh = header.offsetHeight  || header.getBoundingClientRect().height  || 60;
        const ch = catWrap.offsetHeight || catWrap.getBoundingClientRect().height || 56;
        document.documentElement.style.setProperty("--nav-h", Math.max(nh, 56) + "px");
        document.documentElement.style.setProperty("--cat-h", Math.max(ch, 44) + "px");
      }
      document.addEventListener("DOMContentLoaded", measureLayout);
      window.addEventListener("load", () => { measureLayout(); setTimeout(measureLayout, 600); });
      if (document.fonts?.ready) document.fonts.ready.then(measureLayout);
      const ro = new ResizeObserver(measureLayout);
      ro.observe(document.getElementById("mainHeader"));
      ro.observe(document.getElementById("catWrap"));
      window.addEventListener("resize", measureLayout, { passive: true });

      /* SCROLL */
      window.addEventListener("scroll", () => {
        const cur = window.scrollY;
        document.getElementById("mainHeader").classList.toggle("scrolled", cur > 10);
        if (window.innerWidth < 880)
          document.getElementById("catWrap").classList.toggle("hide", cur > lastScroll + 2 && cur > 120);
        else document.getElementById("catWrap").classList.remove("hide");
        lastScroll = cur;
      }, { passive: true });

      /* THEME */
      function applyTheme(t) {
        document.documentElement.setAttribute("data-theme", t);
        document.getElementById("themeIcon").innerHTML = t === "dark"
          ? '<path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.4 6.4l-.7-.7M6.3 6.3l-.7-.7m12.8 0l-.7.7M6.3 17.7l-.7.7M12 7a5 5 0 100 10 5 5 0 000-10z"/>'
          : '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';
        try { localStorage.setItem("umkm_theme", t); } catch(e) {}
      }
      function toggleTheme() {
        applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
      }
      (function() {
        try { applyTheme(localStorage.getItem("umkm_theme") || "dark"); } catch(e) { applyTheme("dark"); }
      })();

      /* TOAST */
      const TICONS = {
        ok:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>',
        err:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg>',
        info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4m0-4h.01"/></svg>',
      };
      function toast(msg, type = "info") {
        const w = document.getElementById("toastWrap"), el = document.createElement("div");
        el.className = "toast " + type;
        el.innerHTML = (TICONS[type] || TICONS.info) + `<span>${msg}</span>`;
        w.appendChild(el);
        setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 320); }, 2700);
      }

      /* RIPPLE */
      document.addEventListener("click", (e) => {
        const el = e.target.closest(".btn,.btn-order,.chip");
        if (!el) return;
        const r = document.createElement("span"), rc = el.getBoundingClientRect(), sz = Math.max(rc.width, rc.height);
        r.className = "ripple";
        r.style.cssText = `width:${sz}px;height:${sz}px;left:${e.clientX-rc.left-sz/2}px;top:${e.clientY-rc.top-sz/2}px`;
        el.appendChild(r);
        setTimeout(() => r.remove(), 650);
      });

      /* LOAD DATA */
      function renderSkel() {
        let h = "";
        for (let i = 0; i < 10; i++)
          h += `<div class="skel"><div class="skel-img"></div><div class="skel-ln w35"></div><div class="skel-ln w50"></div><div class="skel-ln"></div></div>`;
        document.getElementById("prodGrid").innerHTML = h;
      }
      async function loadData() {
        renderSkel();
        try {
          const res = await fetch(API);
          const raw = await res.json();
          products = Array.isArray(raw) ? raw : [];
          buildChips();
          filterAndRender();
          updateBadge();
        } catch (e) {
          console.error("loadData error:", e);
          document.getElementById("prodGrid").innerHTML =
            `<div class="empty-s err"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg><b>Gagal memuat produk.</b><small>Periksa deployment script, lalu muat ulang halaman.</small></div>`;
          const dot = document.querySelector(".dot-live");
          if (dot) dot.style.background = "var(--danger)";
          document.getElementById("heroBadgeTxt").textContent = "Gagal memuat data";
        }
      }
      function updateBadge() {
        const t = products.length, k = new Set(products.map(p => p.kategori).filter(Boolean)).size;
        document.getElementById("heroBadgeTxt").textContent = `${t} produk · ${k} kategori`;
      }

      /* CHIPS */
      function buildChips() {
        const strip = document.getElementById("catStrip");
        const kats = [...new Set(products.map(p => p.kategori).filter(Boolean))];
        let h = `<button class="chip${activeKat===""?" active":""}" data-kat=""><span>Semua</span></button>`;
        kats.forEach(k => h += `<button class="chip${activeKat===k?" active":""}" data-kat="${k}"><span>${k}</span></button>`);
        strip.innerHTML = h;
        strip.querySelectorAll(".chip").forEach(c => c.addEventListener("click", function() {
          strip.querySelectorAll(".chip").forEach(x => x.classList.remove("active"));
          this.classList.add("active");
          activeKat = this.dataset.kat;
          filterAndRender();
          this.scrollIntoView({ behavior:"smooth", block:"nearest", inline:"center" });
        }));
        checkCatEnd();
      }
      function checkCatEnd() {
        const s = document.getElementById("catStrip"), i = document.getElementById("catInner");
        if (!s || !i) return;
        i.classList.toggle("at-end", s.scrollLeft + s.clientWidth >= s.scrollWidth - 4 || s.scrollWidth <= s.clientWidth);
      }
      document.getElementById("catStrip").addEventListener("scroll", checkCatEnd, { passive: true });
      window.addEventListener("resize", checkCatEnd);

      /* FILTER & RENDER */
      function filterAndRender() {
        const data = products.filter(p =>
          (p.nama_produk || "").toLowerCase().includes(searchKw) &&
          (activeKat === "" || p.kategori === activeKat)
        );
        document.getElementById("secTitle").textContent = activeKat || "Semua Produk";
        const rc = document.getElementById("resCount");
        rc.textContent = data.length + " produk";
        rc.classList.remove("pop"); void rc.offsetWidth; rc.classList.add("pop");
        renderProds(data);
      }
      function renderProds(data) {
        const grid = document.getElementById("prodGrid");
        grid.innerHTML = "";
        if (!data || !data.length) {
          grid.innerHTML = `<div class="empty-s"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-3.5-3.5"/></svg><b>Produk tidak ditemukan.</b><small>Coba kata kunci atau kategori lain.</small></div>`;
          return;
        }
        const isAdmin = userLogin?.role === "admin";
        data.forEach((item, idx) => {
          const stok = Number(item.stok || 0);
          let badge = "";
          if (stok === 0) badge = `<span class="badge b-empty">Habis</span>`;
          else if (stok <= 5) badge = `<span class="badge b-low">Sisa ${stok}</span>`;
          const card = document.createElement("div");
          card.className = "card";
          card.style.transitionDelay = Math.min(idx, 14) * 26 + "ms";
          card.innerHTML = `
            <div class="card-badges">${badge}</div>
            <button class="btn-del" style="display:${isAdmin?"flex":"none"}" onclick="delProd('${item.id}',event)" aria-label="Hapus">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
            <div class="card-img">${item.gambar || "📦"}</div>
            <div class="card-body">
              <span class="card-kat">${item.kategori || ""}</span>
              <div class="card-name">${item.nama_produk || ""}</div>
              <div class="card-price">Rp ${item.harga.toLocaleString("id-ID")}</div>
              <div class="card-meta">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/></svg>
                <span>Stok: ${stok}</span>
              </div>
              <p class="card-desc">${item.deskripsi || ""}</p>
              ${stok === 0
                ? `<div class="btn-dis">Stok Habis</div>`
                : `<div class="card-actions">
                    <button class="btn-order" onclick="orderWA('${item.id}')">Beli</button>
                    <button class="btn-addcart" onclick="onlyAddToCart(this,'${item.id}')" title="Tambah ke keranjang" aria-label="Tambah ke keranjang">🛒</button>
                   </div>`
              }
            </div>`;
          grid.appendChild(card);
          requestAnimationFrame(() => requestAnimationFrame(() => card.classList.add("in")));
        });
      }

      /* ============================================================
         ORDER & CART
         Semua WA — baik tombol "Beli" di kartu maupun checkout
         keranjang — diarahkan ke SATU nomor WA toko (C01).
      ============================================================ */
      function orderWA(id) {
        const item = products.find(p => String(p.id) === String(id));
        if (!item) return;
        const nomor = getStoreWA();
        if (!nomor) { toast("Nomor WhatsApp toko belum tersedia.", "err"); return; }
        const harga = Number(item.harga).toLocaleString("id-ID");
        const pesan = encodeURIComponent(
          `Halo, saya ingin memesan:\n\n` +
          `🛍️ *${item.nama_produk}*\n` +
          `💰 Harga: Rp ${harga}\n\n` +
          `Apakah masih tersedia? Terima kasih 🙏`
        );
        window.open(`https://wa.me/${nomor}?text=${pesan}`, "_blank");
      }

      function onlyAddToCart(btn, id) {
        const item = products.find(p => String(p.id) === String(id));
        if (!item) return;
        flyToCart(btn, item.gambar || "📦");
        addToCart(item);
        btn.classList.add("added");
        setTimeout(() => btn.classList.remove("added"), 420);
        toast(`${item.nama_produk} ditambah ke keranjang 🛒`, "ok");
      }

      function checkoutWA() {
        if (!cart.length) return;
        const nomor = getStoreWA();
        if (!nomor) { toast(`Nomor WA toko (${STORE_KONTAK_ID}) tidak ditemukan di database.`, "err"); return; }
        const total = cart.reduce((s, c) => s + c.harga * c.qty, 0).toLocaleString("id-ID");
        const listProduk = cart.map(c =>
          `• ${c.nama} (${c.qty}x) — Rp ${(c.harga * c.qty).toLocaleString("id-ID")}`
        ).join("\n");
        const pesan = encodeURIComponent(
          `Halo, saya ingin memesan:\n\n${listProduk}\n\n` +
          `💰 *Total: Rp ${total}*\n\n` +
          `Mohon konfirmasi ketersediaan. Terima kasih 🙏`
        );
        window.open(`https://wa.me/${nomor}?text=${pesan}`, "_blank");
      }

      function flyToCart(btn, emoji) {
        const fr = btn.getBoundingClientRect();
        const tgt = window.innerWidth < 880
          ? document.querySelector("[data-bn='cart']")
          : document.getElementById("cartBtnTop");
        if (!tgt) return;
        const tr = tgt.getBoundingClientRect();
        const fly = document.createElement("div");
        fly.className = "fly";
        fly.textContent = emoji;
        fly.style.cssText = `left:${fr.left+fr.width/2-12}px;top:${fr.top+fr.height/2-12}px;opacity:1;transform:scale(1)`;
        document.body.appendChild(fly);
        requestAnimationFrame(() => {
          fly.style.left = tr.left + tr.width/2 - 12 + "px";
          fly.style.top  = tr.top  + tr.height/2 - 12 + "px";
          fly.style.transform = "scale(.25)";
          fly.style.opacity = "0";
        });
        setTimeout(() => { fly.remove(); syncBadges(); }, 700);
      }
      function addToCart(item) {
        const f = cart.find(c => String(c.id) === String(item.id));
        if (f) f.qty++;
        else cart.push({ id: item.id, nama: item.nama_produk, harga: item.harga, gambar: item.gambar || "📦", qty: 1 });
        syncBadges();
      }
      function syncBadges() {
        const total = cart.reduce((s, c) => s + c.qty, 0);
        [document.getElementById("cartBadgeTop"), document.getElementById("cartBadgeBn")].forEach(b => {
          if (!b) return;
          b.textContent = total;
          total > 0 ? b.classList.add("show") : b.classList.remove("show");
        });
      }
      function openCart() { renderCart(); document.getElementById("modalCart").classList.add("open"); }
      function renderCart() {
        const lEl = document.getElementById("cartListEl"), tEl = document.getElementById("cartTotalEl");
        const btnCheckout = document.getElementById("btnCheckoutWA");
        if (!cart.length) {
          lEl.innerHTML = `<div class="cart-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg><p>Keranjang masih kosong.</p><small>Tekan Order via WA untuk menambahkan produk.</small></div>`;
          tEl.innerHTML = ""; btnCheckout.style.display = "none"; return;
        }
        lEl.innerHTML = cart.map(c =>
          `<div class="cart-row"><div class="cart-emoji">${c.gambar}</div><div class="cart-info"><b>${c.nama}</b><small>Rp ${c.harga.toLocaleString("id-ID")} × ${c.qty}</small></div><button class="cart-rm" onclick="rmFromCart('${c.id}')" aria-label="Hapus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>`
        ).join("");
        const total = cart.reduce((s, c) => s + c.harga * c.qty, 0);
        const nomorTujuan = getStoreWA(), namaToko = getStoreName();
        const infoWA = nomorTujuan
          ? `<span>Dipesan ke: <b>${namaToko}</b> (+${nomorTujuan})</span>`
          : `<span style="color:var(--danger)">Nomor WA toko (${STORE_KONTAK_ID}) tidak ditemukan</span>`;
        tEl.innerHTML = `
          <div class="cart-wa-info">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
            ${infoWA}
          </div>
          <div class="cart-total"><span>Total</span><span style="color:var(--ac)">Rp ${total.toLocaleString("id-ID")}</span></div>`;
        btnCheckout.style.display = "block";
      }
      function rmFromCart(id) { cart = cart.filter(c => String(c.id) !== String(id)); renderCart(); syncBadges(); }

      /* SEARCH */
      const $si = document.getElementById("searchInput"), $sc = document.getElementById("searchClear");
      $si.addEventListener("input", function() {
        searchKw = this.value.toLowerCase().trim();
        $sc.classList.toggle("show", !!this.value);
        filterAndRender();
      });
      function clearSearch() { $si.value = ""; searchKw = ""; $sc.classList.remove("show"); filterAndRender(); $si.focus(); }

      /* BOTTOM NAV */
      function movePill(active) {
        const pill = document.getElementById("bnPill"), row = document.getElementById("bnRow");
        if (!pill || !active || !row) return;
        const rr = row.getBoundingClientRect(), br = active.getBoundingClientRect();
        pill.style.width = br.width + "px";
        pill.style.transform = `translateX(${br.left - rr.left}px)`;
      }
      function bnGo(t) {
        document.querySelectorAll(".bn-item").forEach(b => b.classList.remove("active"));
        const btn = document.querySelector(`[data-bn="${t}"]`);
        if (btn) { btn.classList.add("active"); movePill(btn); }
        if (t === "home") window.scrollTo({ top: 0, behavior: "smooth" });
      }
      function handleBnAdmin() { if (userLogin) { /* sudah login */ } else openLogin(); }
      window.addEventListener("load", () => movePill(document.querySelector(".bn-item.active")));
      window.addEventListener("resize", () => movePill(document.querySelector(".bn-item.active")));
      new ResizeObserver(() => movePill(document.querySelector(".bn-item.active"))).observe(document.getElementById("bnRow"));

      /* AUTH */
      function openLogin() {
        document.getElementById("logUser").value = "";
        document.getElementById("logPass").value = "";
        document.getElementById("modalLogin").classList.add("open");
        setTimeout(() => document.getElementById("logUser").focus(), 380);
      }
      document.getElementById("logPass").addEventListener("keydown", e => { if (e.key==="Enter") document.getElementById("btnLoginSub").click(); });
      document.getElementById("logUser").addEventListener("keydown", e => { if (e.key==="Enter") document.getElementById("logPass").focus(); });

      async function doLogin(btn) {
        const u = document.getElementById("logUser").value.trim();
        const p = document.getElementById("logPass").value;
        if (!u || !p) { toast("Username dan password wajib diisi!", "err"); return; }
        const orig = btn.textContent;
        btn.textContent = "Memproses..."; btn.disabled = true;
        try {
          const res = await fetch(API, {
            method: "POST",
            body: JSON.stringify({ action: "login", username: u, password: p }),
          });
          const data = await res.json();
          if (data.status === true && data.role === "admin") {
            onLoginOk({ username: data.username, nama: data.nama, role: data.role });
          } else if (data.status === true && data.role !== "admin") {
            toast("Akses ditolak. Hanya admin yang bisa login.", "err");
            btn.textContent = orig; btn.disabled = false;
          } else {
            toast(data.message || "Username atau password salah!", "err");
            btn.textContent = orig; btn.disabled = false;
            const modal = document.querySelector("#modalLogin .modal");
            modal.style.animation = "none"; void modal.offsetWidth;
            modal.style.animation = "shake .4s var(--spring)";
          }
        } catch (e) {
          toast("Gagal terhubung ke server.", "err");
          btn.textContent = orig; btn.disabled = false;
        }
      }

      function onLoginOk(user) {
        userLogin = user;
        closeModal("modalLogin");
        document.getElementById("btnLoginSub").textContent = "Masuk sebagai Admin";
        document.getElementById("btnLoginSub").disabled = false;
        const fn = user.nama.split(" ")[0];
        document.getElementById("btnLoginHeader").style.display = "none";
        document.getElementById("adminPill").style.display = "flex";
        document.getElementById("adminNameTxt").textContent = fn;
        document.getElementById("adminAvatar").textContent = fn.charAt(0).toUpperCase();
        document.getElementById("btnLogout").style.display = "flex";
        document.getElementById("btnLogout").classList.add("mobile-show");
        document.getElementById("bnAdminLabel").textContent = fn;
        document.getElementById("heroTitle").innerHTML = "Dashboard <em>Manajemen Admin</em>";
        document.getElementById("heroSub").textContent = "Kelola produk katalog UMKM kamu di sini.";
        document.getElementById("btnAdd").style.display = "inline-block";
        toast(`Selamat datang, ${fn}! 👑`, "ok");
        filterAndRender();
      }

      function doLogout() {
        userLogin = null;
        document.getElementById("btnLoginHeader").style.display = "flex";
        document.getElementById("adminPill").style.display = "none";
        document.getElementById("btnLogout").style.display = "none";
        document.getElementById("btnLogout").classList.remove("mobile-show");
        document.getElementById("bnAdminLabel").textContent = "Admin";
        document.getElementById("heroTitle").innerHTML = "Belanja Produk <em>UMKM Lokal</em>, Lebih Dekat";
        document.getElementById("heroSub").textContent = "Dukung usaha kecil di sekitarmu — pesan langsung lewat WhatsApp.";
        document.getElementById("btnAdd").style.display = "none";
        filterAndRender();
        toast("Berhasil keluar dari akun admin.", "info");
        bnGo("home");
      }

      /* ADD / DELETE PRODUCT */
      function openAddProd() {
        ["pNama","pHarga","pDesk","pImg"].forEach(id => (document.getElementById(id).value = ""));
        document.getElementById("pStok").value = "10";
        document.getElementById("modalProd").classList.add("open");
      }
      async function doAddProd(btn) {
        const nama  = document.getElementById("pNama").value.trim();
        const harga = document.getElementById("pHarga").value;
        if (!nama || !harga) { toast("Nama dan harga wajib diisi!", "err"); return; }
        const orig = btn.textContent;
        btn.textContent = "Menyimpan..."; btn.disabled = true;
        try {
          await fetch(API, {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify({
              action: "add",
              data: {
                nama_produk: nama,
                harga,
                deskripsi: document.getElementById("pDesk").value,
                gambar:    document.getElementById("pImg").value || "📦",
                id_kategori: document.getElementById("pKat").value,
                stok:      document.getElementById("pStok").value,
                id_kontak: STORE_KONTAK_ID,   // selalu pakai kontak toko (C01)
              },
            }),
          });
          closeModal("modalProd");
          toast("Produk berhasil ditambahkan! ✅", "ok");
          setTimeout(loadData, 1200);
        } catch (e) {
          toast("Gagal menyimpan produk.", "err");
        }
        btn.textContent = orig; btn.disabled = false;
      }
      async function delProd(id, e) {
        e.stopPropagation();
        if (!confirm("Hapus produk ini dari database cloud?")) return;
        try {
          await fetch(API, { method: "POST", mode: "no-cors", body: JSON.stringify({ action: "delete", id }) });
          toast("Produk dihapus.", "info");
          setTimeout(loadData, 1200);
        } catch (e) {
          toast("Gagal menghapus produk.", "err");
        }
      }

      /* MODAL HELPERS */
      function closeModal(id) { document.getElementById(id).classList.remove("open"); }
      function overlayClick(e, id) { if (e.target === document.getElementById(id)) closeModal(id); }
      document.addEventListener("keydown", e => {
        if (e.key === "Escape") ["modalLogin","modalProd","modalCart"].forEach(closeModal);
      });

      loadData();
      loadStoreContact();
    </script>
  </body>
</html>
