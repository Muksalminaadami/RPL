<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katalog UMKM Premium - Dashboard Admin & Pembeli</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"/>
<style>
/* ══════════════════════════════════════
   SISTEM DESAIN & UI PREMIUM CONTRAST
   ══════════════════════════════════════ */
:root {
  --ease-io: cubic-bezier(0.25, 1, 0.5, 1);
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 24px;
}
[data-theme="dark"] {
  --bg: #0b0f19;
  --bg-surface: #121826;
  --bg-card: #172033;
  --border: rgba(56, 189, 248, 0.08);
  --border-focus: rgba(56, 189, 248, 0.4);
  --text-main: #f1f5f9;
  --text-muted: #94a3b8;
  --primary: #38bdf8;
  --primary-glow: rgba(56, 189, 248, 0.15);
  --success: #10b981;
  --danger: #f43f5e;
  --shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
}
[data-theme="light"] {
  --bg: #f8fafc;
  --bg-surface: #ffffff;
  --bg-card: #f1f5f9;
  --border: rgba(15, 23, 42, 0.06);
  --border-focus: rgba(2, 132, 199, 0.4);
  --text-main: #0f172a;
  --text-muted: #64748b;
  --primary: #0284c7;
  --primary-glow: rgba(2, 132, 199, 0.1);
  --success: #10b981;
  --danger: #e11d48;
  --shadow: 0 20px 40px rgba(15, 23, 42, 0.05);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Plus Jakarta Sans", sans-serif;
  background-color: var(--bg);
  color: var(--text-main);
  min-height: 100vh;
  transition: background-color 0.4s var(--ease-io), color 0.4s var(--ease-io);
  padding-top: 74px;
}

/* NAVBAR */
header {
  position: fixed; top: 0; left: 0; width: 100%; z-index: 500; height: 74px; padding: 0 max(24px, 4vw);
  display: flex; align-items: center; justify-content: space-between;
  background-color: rgba(11, 15, 25, 0.75); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}
[data-theme="light"] header { background-color: rgba(248, 254, 252, 0.8); }

.brand-logo { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 1.25rem; color: var(--text-main); text-decoration: none; display: flex; align-items: center; gap: 8px; }
.brand-logo span { color: var(--primary); }

.search-box-wrapper { display: flex; align-items: center; gap: 12px; background: var(--bg-surface); padding: 6px 12px; border-radius: var(--radius-md); border: 1px solid var(--border); width: 100%; max-width: 460px; transition: border-color 0.3s; }
.search-box-wrapper:focus-within { border-color: var(--primary); }
.search-box-wrapper input { background: transparent; border: none; color: var(--text-main); outline: none; width: 100%; font-size: 0.9rem; }
.search-box-wrapper select { background: transparent; border: none; color: var(--text-muted); outline: none; font-size: 0.85rem; font-weight: 600; cursor: pointer; padding-left: 8px; border-left: 1px solid var(--border); }

/* SUB-BAR STATUS & AUTH */
.status-bar { max-width: 1240px; margin: 20px auto 0; padding: 14px 24px; background: var(--bg-surface); border-radius: var(--radius-md); border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.profile-info { display: flex; align-items: center; gap: 10px; }
.avatar-status { width: 10px; height: 10px; border-radius: 50%; background: var(--text-muted); }
.avatar-status.active-admin { background: var(--danger); box-shadow: 0 0 10px var(--danger); }
.avatar-status.active-buyer { background: var(--success); box-shadow: 0 0 10px var(--success); }
.user-meta-text { font-size: 0.875rem; font-weight: 500; color: var(--text-muted); }
.user-meta-text strong { color: var(--text-main); }

.btn { padding: 10px 18px; border-radius: var(--radius-sm); border: none; font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: all 0.3s var(--ease-io); font-family: inherit; display: inline-flex; align-items: center; gap: 8px; }
.btn-primary { background: var(--primary); color: #000; }
.btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
.btn-success { background: var(--success); color: #fff; }
.btn-success:hover { box-shadow: 0 8px 20px rgba(16,185,129,0.2); }
.btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
.btn-secondary:hover { background: var(--bg-card); }

/* HERO SECTION */
.hero-header { text-align: center; max-width: 600px; margin: 40px auto; padding: 0 16px; }
.hero-header h1 { font-family: "Space Grotesk", sans-serif; font-size: 2.25rem; font-weight: 700; letter-spacing: -0.02em; }
.hero-header h1 span { color: var(--primary); }

/* MAIN GRID LAYOUT */
.main-layout { max-width: 1240px; margin: 0 auto; padding: 0 24px 80px; }
.grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; }

/* PREMIUM KARTU PRODUK */
.product-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; display: flex; flex-direction: column; position: relative; transition: all 0.35s var(--ease-io); }
.product-card:hover { transform: translateY(-6px); border-color: var(--border-focus); box-shadow: var(--shadow); }
.img-container { height: 160px; display: flex; justify-content: center; align-items: center; font-size: 4rem; background: linear-gradient(135deg, var(--bg-surface), var(--bg)); border-bottom: 1px solid var(--border); position: relative; }
.category-badge { position: absolute; bottom: 12px; left: 12px; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); color: #fff; padding: 4px 10px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1); }
.product-info { padding: 20px; flex: 1; display: flex; flex-direction: column; }
.product-title { font-size: 1.05rem; font-weight: 700; line-height: 1.4; margin-bottom: 8px; color: var(--text-main); }
.product-price { font-family: "Space Grotesk", sans-serif; font-size: 1.15rem; font-weight: 700; color: var(--primary); margin-bottom: 12px; }
.product-desc { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 20px; }

.btn-order-wa { margin-top: auto; width: 100%; text-align: center; background: #22c55e; color: #fff; text-decoration: none; padding: 12px; border-radius: var(--radius-sm); font-weight: 700; font-size: 0.85rem; display: block; transition: background 0.2s; }
.btn-order-wa:hover { background: #16a34a; }

/* ADMIN BADGE & ACTION BUTTONS */
.admin-card-action { position: absolute; top: 12px; right: 12px; z-index: 10; display: none; }
.btn-circle-del { width: 32px; height: 32px; border-radius: 50%; background: rgba(244, 63, 94, 0.2); border: 1px solid rgba(244, 63, 94, 0.4); color: var(--danger); font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); transition: all 0.2s; }
.btn-circle-del:hover { background: var(--danger); color: #fff; }

/* DIALOG MODAL SKELETON */
.modal-backdrop { display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(11, 15, 25, 0.8); backdrop-filter: blur(8px); align-items: center; justify-content: center; padding: 20px; }
.modal-backdrop.is-open { display: flex; }
.modal-window { width: 100%; max-width: 440px; background: var(--bg-surface); border: 1px solid var(--border-focus); border-radius: var(--radius-lg); padding: 32px; box-shadow: var(--shadow); animation: scaleUp 0.3s var(--ease-io); }
@keyframes scaleUp { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal-header-title { font-family: "Space Grotesk", sans-serif; font-size: 1.35rem; font-weight: 700; margin-bottom: 24px; }

.input-field-group { margin-bottom: 16px; }
.input-field-group label { display: block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; letter-spacing: 0.02em; }
.input-field-group input, .input-field-group select, .input-field-group textarea { width: 100%; padding: 12px; background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border); border-radius: var(--radius-sm); outline: none; font-family: inherit; font-size: 0.9rem; transition: border-color 0.2s; }
.input-field-group input:focus, .input-field-group select:focus, .input-field-group textarea:focus { border-color: var(--primary); }
</style>
</head>
<body>

<header>
  <a class="brand-logo" href="#">🏪 UMKM<span>Hub</span></a>
  <div class="search-box-wrapper">
    <input type="text" id="inputSearch" placeholder="Cari produk berdasarkan nama...">
    <select id="filterKategori"><option value="">Semua Kategori</option></select>
  </div>
</header>

<div class="status-bar">
  <div class="profile-info">
    <div id="statusDot" class="avatar-status"></div>
    <div id="textUserStatus" class="user-meta-text">Mode: <strong>Pelanggan Umum</strong></div>
  </div>
  <div>
    <button id="btnTambahProduk" class="btn btn-success" style="display: none;" onclick="openModal('modalFormProduk')">+ Produk</button>
    <button id="btnAuthSession" class="btn btn-secondary" onclick="toggleAuthSession()">Login</button>
  </div>
</div>

<section class="hero-header">
  <h1 id="dynamicHeadline">Katalog Kriya & Kuliner <span>Nusantara</span></h1>
</section>

<main class="main-layout">
  <div id="catalogGrid" class="grid-container">
    <div style="text-align: center; grid-column: 1/-1; color: var(--text-muted); padding: 40px 0;">Menghubungkan data relasi multi-tabel...</div>
  </div>
</main>

<div class="modal-backdrop" id="modalAuth">
  <div class="modal-window">
    <div class="modal-header-title">Autentikasi Pengelola</div>
    <div class="input-field-group">
      <label>Username</label>
      <input type="text" id="authUsername" placeholder="Masukkan username">
    </div>
    <div class="input-field-group">
      <label>Password</label>
      <input type="password" id="authPassword" placeholder="••••••••">
    </div>
    <button id="btnSubmitLogin" class="btn btn-primary" style="width: 100%; margin-top: 12px; justify-content: center;" onclick="handleLoginRequest()">Masuk Sistem</button>
    <button class="btn btn-secondary" style="width: 100%; margin-top: 8px; justify-content: center;" onclick="closeModal('modalAuth')">Batal</button>
  </div>
</div>

<div class="modal-backdrop" id="modalFormProduk">
  <div class="modal-window">
    <div class="modal-header-title">Unggah Produk Baru</div>
    <div class="input-field-group"><label>Nama Produk</label><input type="text" id="formNama"></div>
    <div class="input-field-group"><label>Harga Jual (Rp)</label><input type="number" id="formHarga"></div>
    <div class="input-field-group"><label>Deskripsi Detail</label><textarea id="formDeskripsi" rows="3"></textarea></div>
    <div class="input-field-group"><label>Visual Representasi (Emoji)</label><input type="text" id="formEmoji" placeholder="🍿 atau 👜"></div>
    <div class="input-field-group">
      <label>Kategori Relasi</label>
      <select id="formKategori"><option value="K01">Kuliner & Camilan</option><option value="K02">Fashion & Kerajinan</option><option value="K03">Kesehatan & Herbal</option></select>
    </div>
    <div class="input-field-group"><label>Stok Gudang</label><input type="number" id="formStok" value="15"></div>
    <div class="input-field-group">
      <label>Kontak Pemilik</label>
      <select id="formKontak"><option value="C01">Dapur Kuliner Nusantara</option><option value="C02">Rumah Kreatif & Konveksi</option><option value="C03">Pondok Herbal Alami</option></select>
    </div>
    <button class="btn btn-success" style="width: 100%; margin-top: 12px; justify-content: center;" onclick="handleCreateProduct()">Publikasikan Produk</button>
    <button class="btn btn-secondary" style="width: 100%; margin-top: 8px; justify-content: center;" onclick="closeModal('modalFormProduk')">Batalkan</button>
  </div>
</div>

<script>
// 📌 TAUTAN DEPLOYMENT RESMI KAMU SUDAH AKTIF DI SINI:
const API_URL = "https://script.google.com/macros/s/AKfycbwDG4N0i2jSCG77a4hgaNNGPVUkyc4-lMqZfdfcpTeqnHKTvZ4bd1pcHBys_2w-a2ItJA/exec";

let globalProducts = [];
let currentSession = null;

async function fetchCloudData() {
  try {
    const response = await fetch(API_URL);
    globalProducts = await response.json();
    renderCatalogGrid(globalProducts);
    buildCategoryFilter(globalProducts);
  } catch(error) {
    document.getElementById("catalogGrid").innerHTML = `<div style="text-align: center; grid-column: 1/-1; color: var(--danger);">Gagal sinkronisasi data cloud. Pastikan URL API Web App Apps Script benar.</div>`;
  }
}

function renderCatalogGrid(data) {
  const container = document.getElementById("catalogGrid");
  container.innerHTML = "";
  
  if(!data || data.length === 0) {
    container.innerHTML = `<div style="text-align: center; grid-column: 1/-1; color: var(--text-muted); padding: 40px 0;">Tidak ditemukan produk di dalam katalog ini.</div>`;
    return;
  }

  data.forEach(product => {
    const isAdmin = currentSession && currentSession.role === 'admin';
    const card = document.createElement("div");
    card.className = "product-card";
    
    card.innerHTML = `
      <div class="admin-card-action" style="display: ${isAdmin ? 'block' : 'none'}">
        <button class="btn-circle-del" title="Hapus Produk" onclick="handleDeleteProduct('${product.id}', event)">✕</button>
      </div>
      <div class="img-container">
        ${product.gambar || '📦'}
        <div class="category-badge">${product.kategori}</div>
      </div>
      <div class="product-info">
        <div class="product-title">${product.nama_produk}</div>
        <div class="product-price">Rp ${Number(product.harga).toLocaleString('id-ID')}</div>
        <div class="product-desc">${product.deskripsi}</div>
        <a href="https://wa.me/${product.kontak}" target="_blank" class="btn-order-wa">Pesan Lewat WhatsApp</a>
      </div>
    `;
    container.appendChild(card);
  });
}

function buildCategoryFilter(data) {
  const dropdown = document.getElementById("filterKategori");
  dropdown.innerHTML = `<option value="">Semua Kategori</option>`;
  const categories = [...new Set(data.map(item => item.kategori))].filter(Boolean);
  categories.forEach(cat => dropdown.innerHTML += `<option value="${cat}">${cat}</option>`);
}

function runFilterMatch() {
  const query = document.getElementById("inputSearch").value.toLowerCase();
  const chosenCat = document.getElementById("filterKategori").value;
  const filtered = globalProducts.filter(item => 
    (item.nama_produk || "").toLowerCase().includes(query) && (chosenCat === "" || item.kategori === chosenCat)
  );
  renderCatalogGrid(filtered);
}
document.getElementById("inputSearch").addEventListener("input", runFilterMatch);
document.getElementById("filterKategori").addEventListener("change", runFilterMatch);

function toggleAuthSession() {
  if(currentSession) {
    currentSession = null;
    document.getElementById("btnAuthSession").textContent = "Login";
    document.getElementById("statusDot").className = "avatar-status";
    document.getElementById("textUserStatus").innerHTML = "Mode: <strong>Pelanggan Umum</strong>";
    document.getElementById("dynamicHeadline").innerHTML = "Katalog Kriya & Kuliner <span>Nusantara</span>";
    document.getElementById("btnTambahProduk").style.display = "none";
    renderCatalogGrid(globalProducts);
  } else {
    openModal('modalAuth');
  }
}

async function handleLoginRequest() {
  const user = document.getElementById("authUsername").value;
  const pass = document.getElementById("authPassword").value;
  const loginBtn = document.getElementById("btnSubmitLogin");

  if(!user || !pass) { alert("Semua kolom login wajib diisi!"); return; }

  loginBtn.textContent = "Mengonfirmasi...";
  loginBtn.disabled = true;

  try {
    await fetch(API_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ action: "login", username: user, password: pass }) });
    
    if(user === "admin" && pass === "admin123") {
      authorizeUserSession({ username: "admin", nama: "Muksalmina Adami", role: "admin" });
    } else if(user === "andi" && pass === "pembeli123") {
      authorizeUserSession({ username: "andi", nama: "Andi", role: "pembeli" });
    } else if(user === "budi" && pass === "budi123") {
      authorizeUserSession({ username: "budi", nama: "Budi Setiawan", role: "pembeli" });
    } else {
      alert("Akses ditolak! Kredensial tidak sesuai.");
      resetLoginButton();
    }
  } catch(e) {
    alert("Gangguan transmisi data: " + e.message);
    resetLoginButton();
  }
}

function removeFormValues() {
  document.getElementById("authUsername").value = "";
  document.getElementById("authPassword").value = "";
}

function resetLoginButton() {
  const loginBtn = document.getElementById("btnSubmitLogin");
  loginBtn.textContent = "Masuk Sistem";
  loginBtn.disabled = false;
}

function authorizeUserSession(sessionData) {
  currentSession = sessionData;
  closeModal('modalAuth');
  resetLoginButton();
  removeFormValues();

  document.getElementById("btnAuthSession").textContent = "Logout";
  
  if(sessionData.role === 'admin') {
    document.getElementById("statusDot").className = "avatar-status active-admin";
    document.getElementById("textUserStatus").innerHTML = `Pengelola: <strong>${sessionData.nama}</strong>`;
    document.getElementById("dynamicHeadline").innerHTML = "Dashboard Utama <span>Management Control</span>";
    document.getElementById("btnTambahProduk").style.display = "inline-flex";
  } else {
    document.getElementById("statusDot").className = "avatar-status active-buyer";
    document.getElementById("textUserStatus").innerHTML = `Pelanggan: <strong>${sessionData.nama}</strong>`;
    document.getElementById("dynamicHeadline").innerHTML = `Selamat Datang Kembali, <span>${sessionData.nama}</span>`;
    document.getElementById("btnTambahProduk").style.display = "none";
  }
  renderCatalogGrid(globalProducts);
}

async function handleCreateProduct() {
  const pData = {
    nama_produk: document.getElementById("formNama").value,
    harga: document.getElementById("formHarga").value,
    deskripsi: document.getElementById("formDeskripsi").value,
    gambar: document.getElementById("formEmoji").value || "📦",
    id_kategori: document.getElementById("formKategori").value,
    stok: document.getElementById("formStok").value,
    id_kontak: document.getElementById("formKontak").value
  };

  if(!pData.nama_produk || !pData.harga) { alert("Nama produk dan Harga wajib diisi!"); return; }

  await fetch(API_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ action: "add", data: pData }) });
  closeModal('modalFormProduk');
  
  document.getElementById("formNama").value = "";
  document.getElementById("formHarga").value = "";
  document.getElementById("formDeskripsi").value = "";
  document.getElementById("formEmoji").value = "";

  setTimeout(fetchCloudData, 1000);
}

async function handleDeleteProduct(id, event) {
  event.stopPropagation();
  if(confirm("Apakah Anda yakin ingin menghapus produk ini secara permanen dari server?")) {
    await fetch(API_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ action: "delete", id: id }) });
    setTimeout(fetchCloudData, 1000);
  }
}

function openModal(id) { document.getElementById(id).classList.add('is-open'); }
function closeModal(id) { document.getElementById(id).classList.remove('is-open'); }

fetchCloudData();
</script>
</body>
</html>
